databases:
  - name: mediclinic-db
    databaseName: mediclinic
    user: mediclinic_user
    plan: free
    ipAllowList: []

services:

  - type: web
    name: mediclinic-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mediclinic-db
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: FRONTEND_URL
        sync: false # Set this to your Vercel URL manually in the Render dashboard later
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUBSCRIPTION_WEBHOOK_SECRET
        sync: false
