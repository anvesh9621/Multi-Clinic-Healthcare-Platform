databases:
  - name: mediclinic-db
    databaseName: mediclinic
    user: mediclinic_admin
    plan: free

services:
  - type: web
    name: mediclinic-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mediclinic-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "https://your-vercel-app-url.vercel.app" # User needs to update this
