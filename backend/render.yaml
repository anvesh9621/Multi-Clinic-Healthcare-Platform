databases:
  - name: mediclinic-db
    databaseName: mediclinic
    user: mediclinic_admin
    plan: free

services:
  - type: web
    name: mediclinic-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 3 --threads 2 --worker-class gthread --timeout 30 --max-requests 1000 --max-requests-jitter 100"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mediclinic-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "https://your-vercel-app-url.vercel.app" # User needs to update this
      - key: REDIS_CACHE_URL
        # MANUAL ACTION REQUIRED ON RENDER DASHBOARD:
        # Provision a distinct Redis instance/addon on Render Dashboard (or Upstash/Redis Cloud)
        # and set this environment variable to its connection string (e.g. rediss://...).
        value: "redis://localhost:6379/1"
